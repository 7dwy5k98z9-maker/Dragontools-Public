[pytest]
qt_api = pyqt6
testpaths = dragontools/tests
addopts = -ra
markers =
    media_integration: reale FFmpeg/FFprobe-Medienfixtures; wird uebersprungen, wenn die Tools fehlen
    dv_hdr_integration: reale DV/HDR10+-Roundtrips mit dovi_tool, hdr10plus_tool und MP4Box; benoetigt explizit konfigurierte Tools
